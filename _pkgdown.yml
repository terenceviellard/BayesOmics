url: https://terenceviellard.github.io/BayesOmics/

template:
  bootstrap: 5
  bslib:
    primary: "#5E72A4"
    link-color: "#4A5C8C"
    base_font:
      google: "Inter"
    heading_font:
      google: "Inter"

home:
  title: BayesOmics
  description: Bayesian Differential Analysis for Omics Data

navbar:
  structure:
    left: [intro, articles, reference]
    right: [github]
  components:
    intro:
      text: Get started
      href: articles/01_basic_pipeline.html
    github:
      icon: fab fa-github
      href: https://github.com/terenceviellard/BayesOmics
      aria-label: GitHub source code

reference:
  - title: Simulate data
    contents:
      - simu_db
      - simu_db_kernel

  - title: Fit the kernel
    contents:
      - fit_kernel
      - fit_block_posterior

  - title: Posterior
    contents:
      - posterior_mean
      - sample_posterior
      - get_muk_block
      - get_sigmak_block
      - print.bayesomics_posterior

  - title: Differential analysis
    contents:
      - group_diff
      - compute_group_diff
      - compute_group_diff_samples
      - compute_multi_diff
      - calculate_group_overlaps
      - print.group_diff_result

  - title: Distance metrics
    contents:
      - ovl_metric
      - wasserstein_metric
      - kl_metric
      - jeffreys_metric
      - bhattacharyya_metric
      - hellinger_metric
      - mahalanobis_metric
      - mean_diff_metric
      - tvd_metric
      - per_feature_metric
      - marginal_metric
      - significant_fraction_metric
      - energy_metric
      - mmd_metric
      - sliced_wasserstein_metric
      - evaluate_metric
      - evaluate_sample_metric
      - requires_shared_kernel
      - is_symmetric_metric

  - title: Block-diagonal partitioning
    contents:
      - partition_by_id
      - partition_by_range
      - partition_dbscan
      - partition_dense
      - partition_diagonal
      - partition_from_annotation
      - resolve_partition
      - as_block_diag_matrix

  - title: Plots
    contents:
      - plot_distrib
      - plot_distrib_each_pair
      - plot_group_overlap_heatmap
      - plot_multi_diff
      - plot_posterior_mean
      - plot_posterior_overlap

articles:
  - title: Start here
    navbar: Start here
    desc: The model in one page, before any code.
    contents:
      - concepts
  - title: Beginner
    navbar: Beginner
    desc: Your first comparison, from simulated data to your own dataset.
    contents:
      - 01_basic_pipeline
      - 02_univariate
      - 03_real_data
  - title: Intermediate
    navbar: Intermediate
    desc: Modelling choices and reading results with several groups.
    contents:
      - 04_pooled_vs_nonpooled
      - 05_multi_group
      - 06_metric_choice
      - 07_unequal_sample_size
  - title: Advanced
    navbar: Advanced
    desc: Other kernels, multi-dimensional inputs and scaling up.
    contents:
      - 08_kernel_choice
      - 09_multi_dim_input
      - 10_block_diagonal
      - 11_performance
  - title: Gallery
    navbar: Gallery
    desc: The key figures at a glance, each linking to its article.
    contents:
      - gallery
  - title: Troubleshooting
    navbar: Troubleshooting
    contents:
      - troubleshooting
